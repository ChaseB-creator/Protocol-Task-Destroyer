<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE766" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="120" height="120" rx="24" fill="#07090f" stroke="#FFD700" stroke-width="2" />
  <!-- Spaceship Wing / Delta Body -->
  <polygon points="60,18 100,95 60,78 20,95" fill="url(#goldGrad)" filter="url(#glow)" />
  <!-- Thruster Core Glow -->
  <circle cx="60" cy="74" r="8" fill="#FFF07C" />
  <circle cx="60" cy="74" r="4" fill="#FFFFFF" />
  <line x1="60" y1="22" x2="60" y2="70" stroke="#050608" stroke-width="2" />
</svg>
